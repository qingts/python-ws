<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dodge Blocks</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: monospace; overflow: hidden; }
  #score { position: fixed; top: 10px; left: 10px; font-size: 18px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="score">Score: 0</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

let player = { x: 100, y: 100, size: 20, speed: 5 };
let keys = {};
let blocks = [];
let score = 0;
let gameOver = false;

window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

function spawnBlock() {
  blocks.push({
    x: Math.random() * canvas.width,
    y: -20,
    size: 20 + Math.random() * 30,
    speed: 2 + Math.random() * 4
  });
}

setInterval(spawnBlock, 500);

function update() {
  if (gameOver) return;

  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;

  player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
  player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

  blocks.forEach(b => b.y += b.speed);

  blocks = blocks.filter(b => b.y < canvas.height + 50);

  blocks.forEach(b => {
    if (
      player.x < b.x + b.size &&
      player.x + player.size > b.x &&
      player.y < b.y + b.size &&
      player.y + player.size > b.y
    ) {
      gameOver = true;
    }
  });

  score++;
  document.getElementById('score').innerText = 'Score: ' + score;
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#0f0';
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.fillStyle = '#f00';
  blocks.forEach(b => ctx.fillRect(b.x, b.y, b.size, b.size));

  if (gameOver) {
    ctx.fillStyle = '#fff';
    ctx.font = '40px monospace';
    ctx.fillText('GAME OVER', canvas.width / 2 - 120, canvas.height / 2);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
